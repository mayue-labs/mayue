<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Prompt Manager (design by mayue)</title>
<script>
(function(){
  try{
    var saved = localStorage.getItem('prompt_manager_theme');
    var theme = saved === 'dark' || saved === 'light'
      ? saved
      : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.dataset.theme = theme;
  }catch(e){
    document.documentElement.dataset.theme = 'light';
  }
})();
</script>
<style>
  :root{
    --bg:#FAFAFA;
    --surface:#EEEEF0;
    --surface-2:#E2E2E4;
    --surface-3:#D8D8DC;
    --input:#FFFFFF;
    --popover:#FFFFFF;
    --accent:#1AAD71;
    --accent-hover:#189A64;
    --accent-glow:rgba(26,173,113,0.16);
    --on-accent:#FFFFFF;
    --on-accent-muted:rgba(255,255,255,0.8);
    --on-accent-soft:rgba(255,255,255,0.2);
    --danger:#F95A5A;
    --danger-hover:#E44D4D;
    --on-danger:#FFFFFF;
    --text:#111111;
    --text-dim:#60646B;
    --text-faint:#9A9AA0;
    --border:#E2E2E4;
    --overlay:rgba(10,12,14,0.6);
    --toast-bg:#111111;
    --toast-text:#FFFFFF;
    --radius-sm:8px;
    --radius-md:12px;
    --radius-lg:16px;
    --radius-xl:22px;
    --shadow-popover:0 8px 24px rgba(0,0,0,0.16);
    --shadow-toast:0 4px 12px rgba(0,0,0,0.15);
    color-scheme: light;
  }
  [data-theme="dark"]{
    --bg:#0F1113;
    --surface:#17191C;
    --surface-2:#20242A;
    --surface-3:#252A31;
    --input:#12161A;
    --popover:#1B1F24;
    --accent:#35D39A;
    --accent-hover:#50DFAE;
    --accent-glow:rgba(53,211,154,0.18);
    --on-accent:#06130D;
    --on-accent-muted:rgba(6,19,13,0.76);
    --on-accent-soft:rgba(6,19,13,0.14);
    --danger:#FF6B6B;
    --danger-hover:#FF8585;
    --on-danger:#1A0707;
    --text:#F3F4F6;
    --text-dim:#B6BBC2;
    --text-faint:#7E858F;
    --border:#2E333A;
    --overlay:rgba(0,0,0,0.62);
    --toast-bg:#252A31;
    --toast-text:#F3F4F6;
    --shadow-popover:0 10px 30px rgba(0,0,0,0.45);
    --shadow-toast:0 6px 18px rgba(0,0,0,0.4);
    color-scheme: dark;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"PingFang SC","Helvetica Neue",Arial,sans-serif;
    min-height:100vh;
    display:flex;
    transition:background-color .18s ease, color .18s ease;
  }
  .mono{font-family:"IBM Plex Mono","SF Mono",Menlo,Consolas,monospace;}

  .app{
    flex:1;
    min-height:100vh;
    position:relative;
    padding:28px 18px 40px;
    max-width:calc(100vw - 250px);
  }

  /* ===== Sidebar Tag Panel ===== */
  .sidebar{
    width:250px;
    min-width:250px;
    min-height:100vh;
    background:var(--surface);
    border:none;
    padding:28px 0 40px;
    display:flex;
    flex-direction:column;
    gap:0;
  }
  .sidebar-app-title{
    font-size:17px;
    font-weight:800;
    color:var(--text);
    width:180px;
    margin:0 auto;
    padding:0 12px 20px 12px;
    text-align:left;
  }
  .sidebar-title{
    font-size:13px;
    font-weight:600;
    color:var(--text);
    width:180px;
    margin:0 auto;
    padding:0 12px 12px 12px;
    text-align:left;
  }
  .sidebar-tags{
    display:flex;
    flex-direction:column;
    gap:2px;
    flex:1;
  }
  .sidebar-tag{
    display:flex;
    align-items:center;
    gap:20px;
    margin:0 auto;
    padding:13px 12px;
    cursor:pointer;
    outline:none;
    transition:all .15s ease;
    border:1px solid transparent;
    background:transparent;
    text-align:left;
    width:180px;
    border-radius:var(--radius-sm);
    position:relative;
  }
  .sidebar-tag:hover{
    background:var(--surface-2);
  }
  .sidebar-tag:focus-visible{
    background:var(--surface-2);
    box-shadow:0 0 0 3px var(--accent-glow);
  }
  .sidebar-tag-name{
    font-size:13px;
    color:var(--text);
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    transition:all .15s ease;
    margin-left:0;
    width:144px;
    text-align:left;
  }
  .sidebar-tag:hover .sidebar-tag-name,
  .sidebar-tag:focus-visible .sidebar-tag-name{
    color:var(--text);
    font-weight:500;
  }
  .sidebar-tag.active,
  .sidebar-tag.active:hover,
  .sidebar-tag.active:focus{
    background:transparent;
  }
  .sidebar-tag.active::before{
    content:'';
    position:absolute;
    top:0;
    bottom:0;
    left:-10px;
    right:-10px;
    background:var(--accent);
    border-radius:var(--radius-sm);
    z-index:0;
  }
  .sidebar-tag > span{
    position:relative;
    z-index:1;
  }
  .sidebar-tag.active .sidebar-tag-name,
  .sidebar-tag.active .sidebar-tag-count{
    color:var(--on-accent);
  }
  .sidebar-tag-count{
    font-size:11px;
    color:var(--text);
    font-weight:600;
    flex-shrink:0;
    margin-left:auto;
  }
  .sidebar-tag:hover .sidebar-tag-count,
  .sidebar-tag:focus-visible .sidebar-tag-count{
    color:var(--text);
  }
  .sidebar-tag.active .sidebar-tag-count{
    color:var(--on-accent);
  }

  .theme-toggle{
    width:32px;
    height:32px;
    margin:0 auto 12px;
    border:none;
    border-radius:50%;
    background:var(--surface-2);
    color:var(--text-dim);
    cursor:pointer;
    outline:none;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    flex-shrink:0;
    transition:background .18s ease, color .18s ease, transform .18s ease;
  }
  .theme-toggle:hover{
    background:var(--surface-3);
    color:var(--text);
  }
  .theme-toggle:active{
    transform:scale(0.96);
  }
  .theme-toggle svg{
    width:16px;
    height:16px;
    position:absolute;
    transition:opacity .18s ease, transform .18s ease;
  }
  .theme-icon-sun{
    opacity:0;
    transform:rotate(-45deg) scale(0.8);
  }
  [data-theme="dark"] .theme-icon-sun{
    opacity:1;
    transform:rotate(0) scale(1);
  }
  [data-theme="dark"] .theme-icon-moon{
    opacity:0;
    transform:rotate(45deg) scale(0.8);
  }

  .sidebar-footer{
    font-size:10px;
    color:var(--text-faint);
    text-align:center;
    margin:0;
    margin-top:auto;
    width:100%;
    padding:0 12px;
    font-weight:500;
  }

  /* ===== Header ===== */
  .controls-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:18px;
    gap:16px;
  }
  .header-left{
    display:flex;
    gap:8px;
  }
  .header-right{
    display:flex;
    gap:8px;
    align-items:center;
  }

  /* ===== Stats ===== */
  .stats{
    display:flex;
    gap:12px;
    margin-bottom:24px;
  }
  .stat{
    background:var(--surface);
    border:none;
    border-radius:var(--radius-md);
    padding:12px 16px;
    text-align:left;
    display:flex;
    flex-direction:row;
    align-items:center;
    justify-content:flex-start;
    gap:8px;
    min-height:60px;
    flex:1;
  }
  .stat-label{
    font-size:14px;
    color:var(--text);
    margin-bottom:0;
    font-weight:600;
    text-transform:none;
    letter-spacing:0;
  }
  .stat .val{
    font-size:16px;
    font-weight:700;
    color:var(--accent);
  }

  /* ===== Search ===== */
  .search{
    position:relative;
    margin-bottom:18px;
  }
  .search-input{
    width:100%;
    padding:13px 28px 13px 48px;
    background:var(--input);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    font-size:14px;
    color:var(--text);
    outline:none;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .search-input::placeholder{color:var(--text-faint);}
  .search-input:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent-glow);
  }
  .search-input.has-value{
    background:var(--input);
  }
  .search-icon{
    position:absolute;
    left:18px;
    top:50%;
    transform:translateY(-50%);
    font-size:16px;
    color:var(--text-faint);
    pointer-events:none;
  }

  /* ===== Archive Toggle ===== */
  .archive-toggle{
    display:flex;
    align-items:center;
    gap:8px;
    min-height:36px;
    font-size:13px;
    color:var(--text-dim);
    cursor:pointer;
    user-select:none;
    background:var(--surface);
    border:1px solid transparent;
    border-radius:var(--radius-md);
    padding:8px 14px;
    font-weight:600;
    transition:all .15s ease;
    outline:none;
  }
  .archive-toggle:hover{
    background:var(--surface-2);
    color:var(--text);
  }
  .archive-toggle input[type="checkbox"]{
    appearance:none;
    -webkit-appearance:none;
    width:16px;
    height:16px;
    border:2px solid var(--text-faint);
    border-radius:50%;
    background:transparent;
    cursor:pointer;
    margin:0;
    position:relative;
    transition:all .15s ease;
    flex-shrink:0;
  }
  .archive-toggle:hover input[type="checkbox"]{
    border-color:var(--text-dim);
  }
  .archive-toggle input[type="checkbox"]:checked{
    background:var(--accent);
    border-color:var(--accent);
  }
  .archive-toggle input[type="checkbox"]:checked::after{
    content:'';
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
    width:6px;
    height:6px;
    background:var(--on-accent);
    border-radius:50%;
  }
  /* ===== Sort Pills (Segmented Control) ===== */
  .sort-pills{
    display:flex;
    background:var(--surface);
    border-radius:var(--radius-md);
    padding:4px;
    gap:2px;
  }
  .sort-pill{
    min-height:32px;
    padding:7px 14px;
    border:none;
    border-radius:var(--radius-sm);
    background:transparent;
    color:var(--text-dim);
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    outline:none;
    transition:all .15s ease;
  }
  .sort-pill:hover{
    background:var(--surface-2);
    color:var(--text);
  }
  .sort-pill.active{
    background:var(--accent);
    color:var(--on-accent);
  }

  /* ===== Prompt List (双列) ===== */
  .prompt-list{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
  }

  /* ===== Prompt Card ===== */
  .prompt-card{
    background:var(--surface);
    border:none;
    border-radius:var(--radius-md);
    padding:12px;
    cursor:pointer;
    outline:none;
    transition:all .15s ease;
    position:relative;
  }
  .prompt-card:hover,
  .prompt-card:focus{
    background:var(--accent);
    border-color:var(--border);
  }
  .prompt-card:hover .prompt-title,
  .prompt-card:focus .prompt-title,
  .prompt-card:hover .prompt-content,
  .prompt-card:focus .prompt-content{
    color:var(--on-accent);
  }
  .prompt-card:hover .prompt-usage,
  .prompt-card:focus .prompt-usage,
  .prompt-card:hover .prompt-date,
  .prompt-card:focus .prompt-date,
  .prompt-card:hover .tag-chip,
  .prompt-card:focus .tag-chip{
    color:var(--on-accent-muted);
  }
  .prompt-card:hover .tag-chip,
  .prompt-card:focus .tag-chip{
    background:var(--on-accent-soft);
  }
  .prompt-card:active{transform:scale(0.98);}

  .prompt-card.archived{
    opacity:0.5;
    background:var(--surface-3);
  }
  .prompt-card.archived:hover,
  .prompt-card.archived:focus{
    opacity:0.65;
  }

  /* 卡片右上角菜单按钮 */
  .card-menu-btn{
    position:absolute;
    top:10px;
    right:10px;
    width:28px;
    height:28px;
    border-radius:50%;
    border:none;
    background:transparent;
    color:var(--text-faint);
    font-size:16px;
    line-height:1;
    cursor:pointer;
    display:none;
    align-items:center;
    justify-content:center;
    outline:none;
    transition:all .15s ease;
    z-index:2;
  }
  .prompt-card:hover .card-menu-btn,
  .prompt-card:focus .card-menu-btn{
    display:flex;
    color:var(--on-accent);
  }
  .card-menu-btn:hover,
  .card-menu-btn:active{
    background:var(--surface-3);
    color:var(--text);
  }
  .prompt-card:hover .card-menu-btn:hover,
  .prompt-card:hover .card-menu-btn:active,
  .prompt-card:focus .card-menu-btn:hover,
  .prompt-card:focus .card-menu-btn:active{
    background:var(--on-accent-soft);
    color:var(--on-accent);
  }

  .prompt-header{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:6px;
    margin-bottom:9px;
    padding-right:28px;
  }
  .prompt-title{
    font-size:14px;
    font-weight:600;
    color:var(--text);
    flex:1;
    min-width:0;
    word-break:break-word;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    max-width:100%;
  }
  .prompt-content{
    font-size:12px;
    color:var(--text-dim);
    line-height:1.6;
    display:-webkit-box;
    -webkit-line-clamp:4;
    -webkit-box-orient:vertical;
    overflow:hidden;
    margin-bottom:11px;
    height:77px;
    min-height:77px;
  }
  .prompt-footer{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:6px;
  }
  .prompt-right{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:6px;
    flex-shrink:0;
  }
  .prompt-usage{
    font-size:13px;
    color:var(--text);
    white-space:nowrap;
  }
  .prompt-tags{
    display:flex;
    flex-wrap:wrap;
    gap:4px;
  }
  .tag-chip{
    display:inline-flex;
    align-items:center;
    padding:3px 8px;
    background:transparent;
    border-radius:var(--radius-sm);
    font-size:12px;
    color:var(--text);
    max-width:100%;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .prompt-date{
    font-size:13px;
    color:var(--text);
    flex-shrink:0;
  }
  .prompt-divider{
    font-size:11px;
    color:var(--text-faint);
    user-select:none;
  }
  .prompt-card:hover .prompt-divider,
  .prompt-card:focus .prompt-divider{
    color:var(--on-accent-muted);
  }

  /* ===== Empty State ===== */
  .empty-state{
    grid-column:1/-1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:80px 40px;
    text-align:center;
  }
  .empty-icon{font-size:48px; margin-bottom:12px; opacity:0.4;}
  .empty-state p{font-size:14px; font-weight:500; margin-bottom:6px; color:var(--text);}
  .empty-state small{font-size:12px; color:var(--text-faint);}

  /* ===== Buttons ===== */
  .io-btn{
    min-height:36px;
    padding:8px 14px;
    background:var(--surface);
    border:1px solid transparent;
    border-radius:var(--radius-md);
    color:var(--text-dim);
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    outline:none;
    transition:all .15s ease;
  }
  .io-btn:hover,
  .io-btn:active{
    background:var(--accent);
    color:var(--on-accent);
    border-color:var(--accent);
  }
  .io-btn svg{width:14px; height:14px; flex-shrink:0;}

  /* ===== Overlay (居中弹窗) ===== */
  .overlay{
    position:fixed; inset:0;
    background:var(--overlay);
    backdrop-filter:blur(3px);
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none;
    transition:opacity .25s ease;
    z-index:100;
    padding:20px;
  }
  .overlay.show{opacity:1; pointer-events:auto;}
  .sheet{
    width:100%; max-width:480px;
    background:var(--surface);
    border-radius:var(--radius-xl);
    padding:24px 22px 28px;
    transform:scale(0.95);
    transition:transform .25s ease;
    border:1px solid var(--border);
    max-height:90vh;
    overflow-y:auto;
  }
  .overlay.show .sheet{transform:scale(1);}
  .sheet h2{
    font-size:16px;
    margin:0 0 20px 0;
    font-weight:600;
    color:var(--text);
  }

  .field{margin-bottom:16px;}
  .field label{
    font-size:12px;
    color:var(--text-dim);
    display:block;
    margin-bottom:8px;
    font-weight:600;
  }
  .field input,
  .field textarea{
    width:100%;
    background:var(--input);
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    padding:14px;
    color:var(--text);
    font-size:14px;
    font-family:inherit;
    outline:none;
    transition:border-color .15s ease, box-shadow .15s ease;
    resize:none;
  }
  .field input::placeholder,
  .field textarea::placeholder{color:var(--text-faint);}
  .field input:focus,
  .field textarea:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent-glow);
  }
  .field textarea{min-height:120px; font-family:"IBM Plex Mono","SF Mono",Menlo,Consolas,monospace;}

  .tag-input-wrap{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    background:var(--input);
    border:1px solid var(--border);
    border-radius:12px;
    padding:10px 12px;
    min-height:50px;
    align-items:flex-start;
    transition:border-color .15s ease, box-shadow .15s ease;
    cursor:text;
  }
  .tag-input-wrap:focus-within{
    border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent-glow);
  }
  .tag-input-chip{
    display:inline-flex;
    align-items:center;
    gap:4px;
    padding:4px 8px 4px 10px;
    background:var(--surface-2);
    border-radius:var(--radius-sm);
    font-size:12px;
    color:var(--text-dim);
    max-width:none;
    overflow:visible;
  }
  .tag-input-wrap .tag-remove{
    cursor:pointer;
    font-size:13px;
    color:var(--text-faint);
    line-height:1;
  }
  .tag-input-wrap .tag-remove:hover{color:var(--danger);}
  .tag-input-wrap input{
    flex:1;
    min-width:80px;
    border:none;
    background:transparent;
    padding:4px 0;
    font-size:13px;
    outline:none;
    box-shadow:none;
  }

  .btn-row{display:flex; gap:10px; margin-top:22px;}
  .btn{
    flex:1;
    padding:14px;
    border-radius:var(--radius-md);
    border:none;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    outline:none;
    transition:all .15s ease;
  }
  .btn-primary{background:var(--accent); color:var(--on-accent);}
  .btn-primary:hover{background:var(--accent-hover);}
  .btn-primary:active{opacity:0.85;}
  .btn-danger{background:var(--danger); color:var(--on-danger);}
  .btn-danger:hover{background:var(--danger-hover);}
  .btn-danger:active{opacity:0.85;}
  .btn-ghost{
    background:var(--surface-2);
    color:var(--text-dim);
    border:1px solid var(--border);
  }
  .btn-ghost:active{background:var(--surface-3);}

  /* ===== Detail Sheet (居中弹窗) ===== */
  .detail-sheet{
    width:100%; max-width:480px;
    background:var(--surface);
    border-radius:var(--radius-xl);
    padding:20px 22px 28px;
    transform:scale(0.95);
    transition:transform .25s ease;
    border:1px solid var(--border);
    max-height:90vh;
    overflow-y:auto;
    position:relative;
  }
  .overlay.show .detail-sheet{transform:scale(1);}
  .detail-header{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    margin-bottom:16px;
    gap:12px;
  }
  .detail-title{
    font-size:16px;
    font-weight:600;
    color:var(--text);
    flex:1;
    word-break:break-word;
  }
  .detail-close{
    width:28px;
    height:28px;
    border:none;
    background:transparent;
    color:var(--text-faint);
    font-size:16px;
    cursor:pointer;
    outline:none;
    flex-shrink:0;
  }
  .detail-close:hover{color:var(--text);}
  .detail-meta{
    display:flex;
    gap:16px;
    margin-bottom:16px;
    font-size:12px;
    color:var(--text-faint);
  }
  .detail-stat{display:flex; gap:6px;}
  .detail-content{
    background:var(--input);
    border-radius:var(--radius-md);
    padding:14px;
    margin-bottom:16px;
    font-size:12px;
    line-height:1.8;
    white-space:pre-wrap;
    word-break:break-word;
    color:var(--text-dim);
  }
  .detail-tags{
    display:flex;
    flex-wrap:wrap;
    gap:4px;
    margin-bottom:16px;
  }

  .card-btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:10px 16px;
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    background:var(--surface);
    color:var(--text-dim);
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    outline:none;
    transition:all .15s ease;
  }
  .card-btn:active{opacity:0.7;}
  .card-btn:hover{
    background:var(--surface-2);
    color:var(--text);
  }
  .card-btn-copy:hover{
    background:var(--accent);
    color:var(--on-accent);
    border-color:var(--accent);
  }
  .card-btn-del{
    color:var(--danger);
  }
  .card-btn-del:hover{
    background:var(--danger);
    color:var(--on-danger);
    border-color:var(--danger);
  }
  /* ===== Card Menu ===== */
  .menu-overlay{
    position:fixed;
    inset:0;
    display:none;
    z-index:300;
  }
  .menu-overlay.show{
    display:block;
  }
  .card-menu{
    background:var(--popover);
    border-radius:var(--radius-md);
    overflow:hidden;
    box-shadow:var(--shadow-popover);
    min-width:130px;
    max-width:90vw;
    position:fixed;
    z-index:301;
  }
  .card-menu-item{
    width:100%;
    padding:12px 16px;
    border:none;
    background:transparent;
    cursor:pointer;
    outline:none;
    font-size:13px;
    color:var(--text-dim);
    text-align:left;
    transition:background .15s ease;
    display:block;
  }
  .card-menu-item:hover,
  .card-menu-item:focus{
    background:var(--surface);
    color:var(--text);
  }
  .card-menu-item:active{
    background:var(--surface-2);
    color:var(--text);
  }
  .card-menu-delete{
    color:var(--danger);
    font-weight:600;
  }
  .card-menu-delete:hover,
  .card-menu-delete:focus{
    background:var(--danger);
    color:var(--on-danger);
  }
  .card-menu-delete:active{
    background:var(--danger-hover);
    color:var(--on-danger);
  }

  .detail-action{
    display:flex;
    gap:8px;
  }

  /* ===== Toast ===== */
  .toast{
    position:fixed;
    bottom:40px;
    left:calc(250px + (100vw - 250px) / 2);
    transform:translateX(-50%) translateY(10px);
    background:var(--toast-bg);
    color:var(--toast-text);
    padding:12px 18px;
    border-radius:var(--radius-md);
    font-size:13px;
    z-index:200;
    box-shadow:var(--shadow-toast);
    opacity:0;
    transition:all .2s ease;
    pointer-events:none;
  }
  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
    pointer-events:auto;
  }

  .sheet-danger-text{
    font-size:13px;
    color:var(--text-dim);
    line-height:1.6;
    margin-bottom:8px;
  }
  .sheet-muted-text{
    font-size:12px;
    color:var(--text-faint);
    margin-bottom:8px;
  }
  .empty-tags{
    padding:12px 16px;
    font-size:12px;
    color:var(--text-faint);
  }

  .io-btn:focus-visible,
  .theme-toggle:focus-visible,
  .archive-toggle:focus-visible,
  .sort-pill:focus-visible,
  .btn:focus-visible,
  .card-btn:focus-visible,
  .detail-close:focus-visible,
  .card-menu-btn:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:2px;
  }
  .card-menu-item:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:-2px;
  }

  /* ===== Responsive ===== */
  @media(max-width:1200px){
    .prompt-list{
      grid-template-columns:1fr;
    }
  }

  @media(max-width:768px){
    body{flex-direction:column;}
    .sidebar{
      width:100%;
      min-height:auto;
      border-right:none;
      border-bottom:1px solid var(--border);
      padding:16px 18px;
      flex-direction:row;
      overflow-x:auto;
      scrollbar-width:none;
    }
    .sidebar::-webkit-scrollbar{display:none;}
    .sidebar-app-title{display:none;}
    .sidebar-title{display:none;}
    .sidebar-footer{display:none;}
    .sidebar-tags{
      flex-direction:row;
      gap:8px;
      flex:none;
    }
    .sidebar-tag{
      padding:6px 12px;
      flex-shrink:0;
    }
    .app{
      max-width:100%;
      padding:16px 12px 30px;
    }
    .controls-row{
      align-items:flex-start;
      flex-direction:column;
    }
    .header-left{
      flex-wrap:wrap;
    }
    .sort-pills{
      width:100%;
    }
    .sort-pill{
      flex:1;
    }
    .prompt-list{grid-template-columns:1fr;}
    .stats{flex-direction:column;}
  }
</style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-app-title">Prompt Manager</div>
  <div class="sidebar-title">标签</div>
  <div class="sidebar-tags" id="sidebarTags"></div>
  <button class="theme-toggle" id="themeToggle" type="button" aria-label="切换到深色模式" aria-pressed="false" title="切换到深色模式">
    <svg class="theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
      <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/>
    </svg>
    <svg class="theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
    </svg>
  </button>
  <div class="sidebar-footer">DESIGN BY MAYUE</div>
</div>

<div class="app">
  <!-- Header -->
  <!-- Stats -->
  <div class="stats">
    <div class="stat">
      <div class="stat-label">提示词</div>
      <div class="val mono" id="statTotal">0</div>
    </div>
    <div class="stat">
      <div class="stat-label">总使用</div>
      <div class="val mono" id="statUsage">0</div>
    </div>
    <div class="stat">
      <div class="stat-label">标签数</div>
      <div class="val mono" id="statTags">0</div>
    </div>
  </div>

  <!-- Controls Row: Buttons + Archive Toggle + Sort Pills -->
  <div class="controls-row">
    <div class="header-left">
      <button class="io-btn" id="fabAdd" title="新增">新增</button>
      <button class="io-btn" id="btnImport" title="导入">导入</button>
      <button class="io-btn" id="btnExport" title="导出">导出</button>
      <label class="archive-toggle" id="archiveToggle">
        <input type="checkbox" id="optArchived">
        <span>已归档</span>
      </label>
    </div>
    
    <!-- Sort Pills -->
    <div class="sort-pills" id="sortPills">
      <button class="sort-pill active" data-sort="created">最新创建</button>
      <button class="sort-pill" data-sort="usage">最常使用</button>
    </div>
  </div>

  <!-- Search -->
  <div class="search">
    <span class="search-icon">🔍</span>
    <input type="text" class="search-input" id="searchInput" placeholder="搜索标题、内容或描述…">
  </div>

  <!-- Prompt List -->
  <div class="prompt-list" id="promptList"></div>

  <input type="file" id="importFile" accept=".json,application/json" style="display:none;">
</div>

<!-- Edit Overlay（新增/编辑） -->
<div class="overlay" id="editOverlay">
  <div class="sheet">
    <h2 id="sheetTitle">新增提示词</h2>
    <div class="field">
      <label>标题 *</label>
      <input type="text" id="inputTitle" placeholder="给这个提示词起个名字…">
    </div>
    <div class="field">
      <label>描述</label>
      <input type="text" id="inputDesc" placeholder="简短描述这个提示词的用途…">
    </div>
    <div class="field">
      <label>内容 *</label>
      <textarea id="inputContent" placeholder="输入提示词内容…支持多行"></textarea>
    </div>
    <div class="field">
      <label>标签</label>
      <div class="tag-input-wrap" id="tagInputWrap">
        <input type="text" id="inputTag" placeholder="输入后按回车添加标签…" />
      </div>
    </div>
    <div class="btn-row">
      <button class="btn btn-ghost" id="btnCancelEdit">取消</button>
      <button class="btn btn-primary" id="btnSaveEdit">保存</button>
    </div>
  </div>
</div>

<!-- Detail Overlay（查看详情） -->
<div class="overlay" id="detailOverlay">
  <div class="detail-sheet" id="detailSheet">
    <div class="detail-header">
      <div class="detail-title" id="detailTitle"></div>
      <button class="detail-close" id="detailClose">✕</button>
    </div>
    <div class="detail-meta">
      <span class="detail-stat">使用 <b id="detailUsage">0</b> 次</span>
      <span class="detail-stat">创建于 <b id="detailDate"></b></span>
    </div>
    <div class="detail-content" id="detailContent"></div>
    <div class="detail-tags" id="detailTags"></div>
    <div class="detail-action">
      <button class="card-btn card-btn-copy" id="detailCopy">复制</button>
      <button class="card-btn" id="detailArchive">归档</button>
      <button class="card-btn card-btn-del" id="detailDel">删除</button>
    </div>
  </div>
</div>

<!-- 提示词操作菜单（卡片风格） -->
<div class="menu-overlay" id="cardMenuOverlay">
  <div class="card-menu">
    <button class="card-menu-item" data-action="edit">
      <span>编辑</span>
    </button>
    <button class="card-menu-item" data-action="archive" id="cardMenuArchive">
      <span id="cardMenuArchiveText">归档</span>
    </button>
    <button class="card-menu-item card-menu-reset" data-action="reset">
      <span>重置次数</span>
    </button>
    <button class="card-menu-item card-menu-cancel" data-action="cancel">
      <span>取消</span>
    </button>
    <button class="card-menu-item card-menu-delete" data-action="delete">
      <span>删除</span>
    </button>
  </div>
</div>

<!-- 删除确认弹窗（居中） -->
<div class="overlay" id="delOverlay">
  <div class="sheet">
    <h2>删除提示词？</h2>
    <div class="sheet-danger-text">
      确定要删除「<strong id="delPromptTitle"></strong>」吗？
    </div>
    <div class="sheet-muted-text">删除后无法恢复。</div>
    <div class="btn-row">
      <button class="btn btn-ghost" id="btnCancelDel">取消</button>
      <button class="btn btn-danger" id="btnConfirmDel">删除</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  const STORAGE_KEY = 'prompt_manager_v1';
  const THEME_KEY = 'prompt_manager_theme';
  const themeToggle = document.getElementById('themeToggle');

  function getSavedTheme(){
    try{ return localStorage.getItem(THEME_KEY); }
    catch(e){ return null; }
  }

  function applyTheme(theme, persist){
    const nextTheme = theme === 'dark' ? 'dark' : 'light';
    const isDark = nextTheme === 'dark';
    document.documentElement.dataset.theme = nextTheme;
    if(persist){
      try{ localStorage.setItem(THEME_KEY, nextTheme); }catch(e){}
    }
    if(themeToggle){
      const label = isDark ? '切换到浅色模式' : '切换到深色模式';
      themeToggle.setAttribute('aria-pressed', String(isDark));
      themeToggle.setAttribute('aria-label', label);
      themeToggle.title = label;
    }
  }

  if(themeToggle){
    themeToggle.addEventListener('click', () => {
      const currentTheme = document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light';
      applyTheme(currentTheme === 'dark' ? 'light' : 'dark', true);
    });
  }

  try{
    const themeMedia = window.matchMedia('(prefers-color-scheme: dark)');
    const handleSystemTheme = e => {
      if(!getSavedTheme()){
        applyTheme(e.matches ? 'dark' : 'light', false);
      }
    };
    if(themeMedia.addEventListener){ themeMedia.addEventListener('change', handleSystemTheme); }
    else if(themeMedia.addListener){ themeMedia.addListener(handleSystemTheme); }
  }catch(e){}

  applyTheme(document.documentElement.dataset.theme || 'light', false);

  let data = { prompts: [] };
  let editingId = null;
  let detailId = null;
  let currentTag = null;
  let sortBy = 'created';  // 'created' 或 'usage'
  let showArchived = false;  // 是否显示已归档的提示词
  let pendingDeleteId = null;
  let menuOpenId = null;  // 菜单打开的提示词ID

  // ===== Storage =====
  function load(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      data = raw ? JSON.parse(raw) : { prompts: [] };
    }catch(e){ data = { prompts: [] }; }
  }
  function save(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  // ===== Toast =====
  function toast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(()=>t.classList.remove('show'), 2000);
  }

  // ===== All Tags =====
  function allTags(){
    const set = new Set();
    data.prompts.forEach(p => (p.tags || []).forEach(t => set.add(t)));
    return [...set].sort();
  }

  // ===== Filtered Prompts =====
  function filteredPrompts(){
    let list = data.prompts;
    
    // 过滤已归档的提示词
    if(!showArchived){
      list = list.filter(p => !p.archived);
    }
    
    if(currentTag){
      list = list.filter(p => p.tags && p.tags.includes(currentTag));
    }
    const q = document.getElementById('searchInput').value.trim().toLowerCase();
    if(q){
      list = list.filter(p =>
        p.title.toLowerCase().includes(q) ||
        p.content.toLowerCase().includes(q) ||
        (p.description && p.description.toLowerCase().includes(q))
      );
    }
    
    // 排序逻辑
    if(sortBy === 'usage'){
      return [...list].sort((a,b) => (b.usageCount || 0) - (a.usageCount || 0));
    } else {
      // 默认按创建时间排序
      return [...list].sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
    }
  }

  // ===== Render Sidebar Tags =====
  function renderSidebarTags(){
    const tags = allTags();
    const container = document.getElementById('sidebarTags');
    if(tags.length === 0){
      container.innerHTML = '<div class="empty-tags">暂无标签</div>';
      return;
    }
    // 统计每个标签的数量
    const tagCount = {};
    data.prompts.forEach(p => (p.tags||[]).forEach(t => { tagCount[t] = (tagCount[t]||0) + 1; }));
    let html = '';
    // 全部标签项
    const total = data.prompts.length;
    html += `<button class="sidebar-tag${!currentTag?' active':''}" data-tag="">
      <span class="sidebar-tag-name"># 全部</span>
      <span class="sidebar-tag-count">${total}</span>
    </button>`;
    tags.forEach(t => {
      html += `<button class="sidebar-tag${currentTag === t?' active':''}" data-tag="${escHtml(t)}">
        <span class="sidebar-tag-name"># ${escHtml(t)}</span>
        <span class="sidebar-tag-count">${tagCount[t]||0}</span>
      </button>`;
    });
    container.innerHTML = html;
    container.querySelectorAll('.sidebar-tag').forEach(btn => {
      btn.addEventListener('click', () => {
        currentTag = btn.dataset.tag || null;
        // 只更新 active 类，不重新渲染整个列表
        container.querySelectorAll('.sidebar-tag').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderList();
      });
    });
  }

  // ===== Render List =====
  function renderList(){
    const list = document.getElementById('promptList');
    const prompts = filteredPrompts();
    const q = document.getElementById('searchInput').value.trim();
    if(prompts.length === 0){
      const isFirstUse = data.prompts.length === 0;
      list.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">📋</div>
          ${isFirstUse
            ? `<p>还没有提示词</p><small>点击「新增」按钮创建第一条</small>`
            : `<p>未匹配到提示词</p><small>请尝试更换搜索词</small>`
          }
        </div>`;
      return;
    }
    list.innerHTML = prompts.map(p => `
      <div class="prompt-card${p.archived ? ' archived' : ''}" data-id="${p.id}" tabindex="0">
        <button class="card-menu-btn" data-menu-id="${p.id}" title="菜单">⋯</button>
        <div class="prompt-header">
          <div class="prompt-title">${escHtml(p.title)}</div>
        </div>
        <div class="prompt-content">${escHtml(p.content)}</div>
        <div class="prompt-footer">
          <div class="prompt-tags">
            ${(p.tags||[]).map(t => `<span class="tag-chip">${escHtml(t)}</span>`).join('')}
          </div>
          <div class="prompt-right">
            <div class="prompt-usage">${p.usageCount||0}次</div>
            <span class="prompt-divider">｜</span>
            <div class="prompt-date">${fmtDate(p.createdAt)}</div>
          </div>
        </div>
      </div>`).join('');

    // 点击卡片 → 复制
    list.querySelectorAll('.prompt-card').forEach(card => {
      card.addEventListener('click', e => {
        // 如果点的是菜单按钮或其子元素，不复制
        if(e.target.closest('.card-menu-btn')) return;
        doCopyAndCount(card.dataset.id);
      });
    });

    // 菜单按钮 → 打开操作菜单
    list.querySelectorAll('.card-menu-btn').forEach(btn => {
      btn.addEventListener('click', e => {
        e.preventDefault();
        e.stopPropagation();
        btn.blur();
        const id = btn.dataset.menuId;
        menuOpenId = id;
        const p = data.prompts.find(x => x.id === id);
        if(!p) return;
        
        // 更新菜单的归档按钮文案
        document.getElementById('cardMenuArchiveText').textContent = p.archived ? '恢复' : '归档';
        
        // 获取按钮的位置
        const rect = btn.getBoundingClientRect();
        const menu = document.querySelector('.card-menu');
        const overlay = document.getElementById('cardMenuOverlay');
        
        // 显示菜单
        overlay.classList.add('show');
        
        // 计算菜单位置（下方，右侧对齐）
        setTimeout(() => {
          const menuRect = menu.getBoundingClientRect();
          const offsetX = rect.right - menuRect.width;  // 右侧对齐
          const offsetY = rect.bottom + 10;  // 下方10px间距
          
          menu.style.position = 'fixed';
          menu.style.left = Math.max(8, offsetX) + 'px';
          menu.style.top = Math.max(8, offsetY) + 'px';
        }, 0);
      });
    });
  }

  // ===== 复制 + 计数 =====
  function doCopyAndCount(id){
    const p = data.prompts.find(x => x.id === id);
    if(!p) return;
    navigator.clipboard.writeText(p.content).then(() => {
      p.usageCount = (p.usageCount||0) + 1;
      p.lastUsedAt = new Date().toISOString();
      save();
      renderStats();
      renderList();
      toast('已复制提示词');
    });
  }

  // ===== Render Stats =====
  function renderStats(){
    const tags = allTags();
    const totalUsage = data.prompts.reduce((s,p) => s + (p.usageCount||0), 0);
    document.getElementById('statTotal').textContent = data.prompts.length;
    document.getElementById('statUsage').textContent = totalUsage;
    document.getElementById('statTags').textContent = tags.length;
  }

  function render(){
    // 只更新标签数量，不重新生成整个列表（避免闪烁）
    updateTagCounts();
    renderList();
    renderStats();
  }
  
  // 只更新标签数量，不重新生成 DOM
  function updateTagCounts(){
    const container = document.getElementById('sidebarTags');
    if(!container || container.children.length === 0){
      renderSidebarTags();
      return;
    }
    const tagCount = {};
    data.prompts.forEach(p => (p.tags||[]).forEach(t => { tagCount[t] = (tagCount[t]||0) + 1; }));
    const total = data.prompts.length;
    // 更新 #全部 的数量
    const allBtn = container.querySelector('[data-tag=""]');
    if(allBtn){
      const countEl = allBtn.querySelector('.sidebar-tag-count');
      if(countEl) countEl.textContent = total;
    }
    // 更新各标签的数量
    container.querySelectorAll('.sidebar-tag[data-tag]').forEach(btn => {
      const tag = btn.dataset.tag;
      if(!tag) return;
      const countEl = btn.querySelector('.sidebar-tag-count');
      if(countEl) countEl.textContent = tagCount[tag] || 0;
    });
  }

  // ===== Detail Sheet =====
  function openDetail(id){
    const p = data.prompts.find(x => x.id === id);
    if(!p) return;
    detailId = id;
    document.getElementById('detailTitle').textContent = p.title;
    document.getElementById('detailUsage').textContent = p.usageCount || 0;
    document.getElementById('detailDate').textContent = fmtDate(p.createdAt);
    document.getElementById('detailContent').textContent = p.content;
    document.getElementById('detailTags').innerHTML =
      (p.tags||[]).map(t => `<span class="tag-chip">${escHtml(t)}</span>`).join('');
    document.getElementById('detailArchive').textContent = p.archived ? '恢复' : '归档';
    document.getElementById('detailOverlay').classList.add('show');
  }

  function closeDetail(){
    detailId = null;
    document.getElementById('detailOverlay').classList.remove('show');
  }

  // ===== Edit Sheet（居中弹窗） =====
  let inputTags = [];

  function renderInputTags(){
    const wrap = document.getElementById('tagInputWrap');
    const input = document.getElementById('inputTag');
    wrap.querySelectorAll('.tag-input-chip').forEach(el => el.remove());
    inputTags.forEach(tag => {
      const span = document.createElement('span');
      span.className = 'tag-input-chip';
      span.dataset.tag = tag;
      span.innerHTML = `${escHtml(tag)}<span class="tag-remove" data-tag="${escHtml(tag)}">✕</span>`;
      wrap.insertBefore(span, input);
    });
  }

  function openAddSheet(){
    editingId = null;
    document.getElementById('sheetTitle').textContent = '新增提示词';
    document.getElementById('inputTitle').value = '';
    document.getElementById('inputContent').value = '';
    document.getElementById('inputDesc').value = '';
    inputTags = [];
    renderInputTags();
    document.getElementById('editOverlay').classList.add('show');
    document.getElementById('inputTitle').focus();
  }

  function openEditSheet(id){
    const p = data.prompts.find(x => x.id === id);
    if(!p) return;
    editingId = id;
    document.getElementById('sheetTitle').textContent = '编辑提示词';
    document.getElementById('inputTitle').value = p.title;
    document.getElementById('inputContent').value = p.content;
    document.getElementById('inputDesc').value = p.description || '';
    inputTags = [...(p.tags||[])];
    renderInputTags();
    document.getElementById('editOverlay').classList.add('show');
    document.getElementById('inputTitle').focus();
  }

  function closeEditSheet(){
    editingId = null;
    document.getElementById('editOverlay').classList.remove('show');
  }

  function getInputTagsFromDOM(){
    return [...document.getElementById('tagInputWrap').querySelectorAll('.tag-input-chip')].map(el => el.dataset.tag);
  }

  function saveEdit(){
    const title = document.getElementById('inputTitle').value.trim();
    const content = document.getElementById('inputContent').value.trim();
    const description = document.getElementById('inputDesc').value.trim();
    const tags = getInputTagsFromDOM();
    if(!title || !content){ toast('标题和内容不能为空'); return; }

    if(editingId){
      const idx = data.prompts.findIndex(p => p.id === editingId);
      if(idx > -1){
        data.prompts[idx] = {
          ...data.prompts[idx],
          title, content, tags, description,
          updatedAt: new Date().toISOString()
        };
      }
      toast('已更新');
    }else{
      data.prompts.push({
        id: Date.now().toString(),
        title, content, tags, description,
        createdAt: new Date().toISOString(),
        usageCount: 0,
        archived: false
      });
      toast('已创建');
    }
    save();
    closeEditSheet();
    render();
  }

  // ===== Delete =====
  function openDelConfirm(id){
    const p = data.prompts.find(x => x.id === id);
    if(!p) return;
    pendingDeleteId = id;
    document.getElementById('delPromptTitle').textContent = p.title;
    document.getElementById('delOverlay').classList.add('show');
  }

  function closeDelConfirm(){
    pendingDeleteId = null;
    document.getElementById('delOverlay').classList.remove('show');
  }

  // ===== 归档功能 =====
  function toggleArchive(id){
    const p = data.prompts.find(x => x.id === id);
    if(p){
      p.archived = !p.archived;
      save();
      render();
      toast(p.archived ? '已归档' : '已恢复');
      closeDetail();
    }
  }

  // ===== 重置次数功能 =====
  function resetUsageCount(id){
    const p = data.prompts.find(x => x.id === id);
    if(p){
      p.usageCount = 0;
      save();
      render();
      toast('已重置使用次数');
      closeDetail();
    }
  }

  function confirmDelete(){
    if(pendingDeleteId){
      data.prompts = data.prompts.filter(p => p.id !== pendingDeleteId);
      save();
      render();
      toast('已删除');
    }
    closeDelConfirm();
    closeDetail();
  }

  // ===== Utils =====
  function escHtml(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function fmtDate(iso){
    const d = new Date(iso);
    const pad = n => String(n).padStart(2,'0');
    return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())}`;
  }

  // ===== Event Bindings =====

  // 新增按钮
  document.getElementById('fabAdd').addEventListener('click', openAddSheet);

  // 排序选项（Pill 按钮）
  const sortPills = document.querySelectorAll('.sort-pill');
  const optArchived = document.getElementById('optArchived');
  
  sortPills.forEach(pill => {
    pill.addEventListener('click', () => {
      sortPills.forEach(p => p.classList.remove('active'));
      pill.classList.add('active');
      sortBy = pill.dataset.sort;
      renderList();
    });
  });
  
  // 已归档选项
  optArchived.addEventListener('change', (e) => {
    showArchived = e.target.checked;
    renderList();
  });

  // 取消编辑
  document.getElementById('btnCancelEdit').addEventListener('click', closeEditSheet);

  // 保存编辑
  document.getElementById('btnSaveEdit').addEventListener('click', saveEdit);

  // 点击 overlay 背景关闭
  document.getElementById('editOverlay').addEventListener('click', e => {
    if(e.target.id === 'editOverlay') closeEditSheet();
  });

  // 详情页关闭
  document.getElementById('detailClose').addEventListener('click', closeDetail);
  document.getElementById('detailOverlay').addEventListener('click', e => {
    if(e.target.id === 'detailOverlay') closeDetail();
  });

  // 详情页操作
  document.getElementById('detailCopy').addEventListener('click', () => {
    if(detailId) doCopyAndCount(detailId);
    closeDetail();
  });
  document.getElementById('detailArchive').addEventListener('click', () => {
    if(detailId) toggleArchive(detailId);
  });
  document.getElementById('detailDel').addEventListener('click', () => {
    if(detailId) openDelConfirm(detailId);
  });

  // 删除确认
  document.getElementById('btnCancelDel').addEventListener('click', closeDelConfirm);
  
  // 卡片菜单事件处理
  document.querySelectorAll('.card-menu-item').forEach(item => {
    item.addEventListener('click', () => {
      const action = item.dataset.action;
      const overlay = document.getElementById('cardMenuOverlay');
      const menu = document.querySelector('.card-menu');
      
      overlay.classList.remove('show');
      menu.style.position = '';
      menu.style.left = '';
      menu.style.top = '';
      
      if(action === 'edit'){
        openEditSheet(menuOpenId);
      } else if(action === 'archive'){
        toggleArchive(menuOpenId);
      } else if(action === 'reset'){
        resetUsageCount(menuOpenId);
      } else if(action === 'delete'){
        openDelConfirm(menuOpenId);
      } else if(action === 'cancel'){
        menuOpenId = null;
      }
    });
  });
  
  // 点击菜单背景关闭
  document.getElementById('cardMenuOverlay').addEventListener('click', e => {
    if(e.target.id === 'cardMenuOverlay'){
      document.getElementById('cardMenuOverlay').classList.remove('show');
      document.querySelector('.card-menu').style.position = '';
      document.querySelector('.card-menu').style.left = '';
      document.querySelector('.card-menu').style.top = '';
      menuOpenId = null;
    }
  });
  document.getElementById('delOverlay').addEventListener('click', e => {
    if(e.target.id === 'delOverlay') closeDelConfirm();
  });
  document.getElementById('btnConfirmDel').addEventListener('click', confirmDelete);

  // 标签输入（回车添加）
  document.getElementById('inputTag').addEventListener('keydown', e => {
    if(e.key === 'Enter' || e.key === ','){
      e.preventDefault();
      const val = e.target.value.trim().replace(/,$/,'').trim();
      if(val && !inputTags.includes(val)){
        inputTags.push(val);
        renderInputTags();
      }
      e.target.value = '';
    }
  });

  // 标签删除 + 聚焦输入框
  document.getElementById('tagInputWrap').addEventListener('click', e => {
    if(e.target.classList.contains('tag-remove')){
      const tag = e.target.dataset.tag;
      inputTags = inputTags.filter(t => t !== tag);
      renderInputTags();
    } else {
      document.getElementById('inputTag').focus();
    }
  });

  // 搜索
  document.getElementById('searchInput').addEventListener('input', function(){
    if(this.value.trim()){
      this.classList.add('has-value');
    } else {
      this.classList.remove('has-value');
    }
    renderList();
  });
  document.getElementById('searchInput').addEventListener('keydown', function(e){
    if(e.key === 'Enter'){
      this.classList.add('has-value');
    }
  });

  // 导入
  document.getElementById('btnImport').addEventListener('click', () => {
    document.getElementById('importFile').click();
  });
  document.getElementById('importFile').addEventListener('change', e => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try{
        const imported = JSON.parse(ev.target.result);
        if(Array.isArray(imported)){ data.prompts = imported; }
        else if(Array.isArray(imported.prompts)){ data = imported; }
        else { throw new Error(); }
        save();
        render();
        toast('导入成功');
      }catch(err){
        toast('导入失败，文件格式不正确');
      } finally { e.target.value = ''; }
    };
    reader.readAsText(file);
  });

  // 导出
  document.getElementById('btnExport').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const d = new Date();
    const pad = n => String(n).padStart(2,'0');
    a.href = url;
    a.download = `prompt-manager-${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast('已导出');
  });

  // ESC 关闭所有 overlay
  document.addEventListener('keydown', e => {
    if(e.key === 'Escape'){
      closeEditSheet();
      closeDetail();
      closeDelConfirm();
    }
  });

  // ===== Init =====
  load();
  render();
})();
</script>
</body>
</html>
