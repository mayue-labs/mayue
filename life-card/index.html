<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>人生进度</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&family=Noto+Sans+SC:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --page:#241812;
    --card-bg:#F0EEE6;
    --text:#000000;
    --time-accent:#D97757;
    --line: rgba(0,0,0,0.12);
    --bar-track:#000000;
    --bar-fill:#D97757;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(circle at 20% 10%, rgba(197,140,60,0.10), transparent 45%),
      radial-gradient(circle at 85% 90%, rgba(124,138,110,0.10), transparent 40%),
      var(--page);
    font-family:'Noto Sans SC', sans-serif;
    color:var(--text);
    padding:32px 20px;
  }
  .stage{ width:100%; max-width:360px; }
  .card{
    position:relative;
    width:100%;
    background:var(--card-bg);
    border:1px solid var(--line);
    border-radius:6px;
    padding:30px 26px 24px;
    box-shadow: 0 24px 48px -20px rgba(0,0,0,0.35), 0 0 0 1px rgba(0,0,0,0.04);
    opacity:0;
    transform:translateY(14px) scale(0.98);
    animation:rise 0.7s cubic-bezier(.2,.8,.2,1) forwards;
  }
  @keyframes rise{ to{ opacity:1; transform:translateY(0) scale(1);} }

  .brand{
    display:flex; align-items:center; justify-content:center; gap:8px;
    font-family:'Noto Serif SC', serif; font-weight:600; font-size:11px;
    letter-spacing:0.3em; color:var(--text); text-transform:uppercase;
    text-align:center;
  }
  .brand svg{ width:13px; height:13px; opacity:0.85; flex-shrink:0; }

  .clock{
    font-family:'Space Mono', monospace;
    font-weight:700;
    font-size:40px;
    letter-spacing:0.02em;
    text-align:center;
    margin-top:20px;
    color:var(--time-accent);
    font-variant-numeric: tabular-nums;
  }
  .clock span.sec{ font-size:40px; color:var(--time-accent); }
  .date-line{
    text-align:center;
    font-size:12px;
    color:var(--text);
    letter-spacing:0.15em;
    margin-top:6px;
    opacity:0.75;
  }

  .rule{ height:1px; background:var(--line); margin:22px 0; }

  .row{ display:flex; align-items:center; justify-content:space-between; gap:18px; }

  .stat-block{ flex:1; }
  .stat-label{ font-size:11px; color:var(--text); letter-spacing:0.2em; text-transform:uppercase; margin-bottom:4px; opacity:0.55; }
  .stat-value{ font-family:'Noto Serif SC', serif; font-weight:900; font-size:18px; color:var(--text); line-height:1.4; }
  .stat-sub{ font-size:11px; color:var(--text); margin-top:2px; opacity:0.65; }

  .progress-side{ display:flex; flex-direction:column; align-items:flex-end; flex-shrink:0; gap:6px; }
  .progress-pct{ font-family:'Space Mono', monospace; font-weight:700; font-size:20px; color:var(--text); }
  .progress-note{ font-size:9px; color:var(--text); opacity:0.5; letter-spacing:0.08em; }
  .progress-track{
    width:96px; height:8px; border-radius:999px; background:var(--bar-track); overflow:hidden;
  }
  .progress-fill{
    height:100%; background:var(--bar-fill); border-radius:999px;
    transition: width 0.6s cubic-bezier(.2,.8,.2,1);
  }

  .meta{
    display:flex; justify-content:space-between; font-size:10px;
    color:var(--text); letter-spacing:0.03em; padding-top:20px; opacity:0.6;
  }

  @media (prefers-reduced-motion: reduce){ .card{ animation:none; opacity:1; transform:none; } }
</style>
</head>
<body>

<div class="stage">
  <div class="card" id="card">
    <div class="brand" id="brandLine">马老师，-- ！</div>

    <div class="clock" id="clock">--:--<span class="sec">:--</span></div>
    <div class="date-line" id="dateLine">-- -- --</div>

    <div class="rule"></div>

    <div class="row">
      <div class="stat-block">
        <div class="stat-label">今年进度</div>
        <div class="stat-value" id="dayOfYear">第 -- 天 / 365</div>
        <div class="stat-sub" id="daysLeft">距年末还有 -- 天</div>
      </div>
      <div class="progress-side">
        <div class="progress-pct" id="yearPct">0%</div>
        <div class="progress-track"><div class="progress-fill" id="yearFill" style="width:0%"></div></div>
      </div>
    </div>

    <div class="rule"></div>

    <div class="row">
      <div class="stat-block">
        <div class="stat-label">今日年龄</div>
        <div class="stat-value" id="ageValue">-- 周岁</div>
        <div class="stat-sub" id="daysLived">已体验 -- 天</div>
      </div>
      <div class="progress-side">
        <div class="progress-note">按80岁计</div>
        <div class="progress-pct" id="lifePct">0%</div>
        <div class="progress-track"><div class="progress-fill" id="lifeFill" style="width:0%"></div></div>
      </div>
    </div>

    <div class="rule"></div>

    <div class="meta">
      <span>人生体验家</span>
      <span>No.1</span>
    </div>
  </div>
</div>

<script>
  // 已通过权威万年历核对：农历1992年十一月初一 = 公历1992年11月24日（壬申年 辛亥月 甲辰日）
  const BIRTH = new Date(1992, 10, 24, 0, 0, 0);
  const LIFE_EXPECTANCY = 80;
  const YEAR_MS = 365.2425 * 86400000;

  function pad(n){ return String(n).padStart(2,'0'); }

  function dayOfYear(d){
    const start = new Date(d.getFullYear(), 0, 0);
    return Math.floor((d - start) / 86400000);
  }

  function greeting(hour){
    if(hour >= 5 && hour < 11) return '早上好';
    if(hour >= 11 && hour < 18) return '中午好';
    return '晚上好';
  }

  const weekMap = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];

  function tick(){
    const now = new Date();

    document.getElementById('brandLine').textContent = `马老师，${greeting(now.getHours())}！`;

    document.getElementById('clock').innerHTML =
      `${pad(now.getHours())}:${pad(now.getMinutes())}<span class="sec">:${pad(now.getSeconds())}</span>`;
    document.getElementById('dateLine').textContent =
      `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 · ${weekMap[now.getDay()]}`;

    const doy = dayOfYear(now);
    const yearPct = Math.min(100, (doy / 365) * 100);
    document.getElementById('dayOfYear').textContent = `第 ${doy} 天 / 365`;
    document.getElementById('daysLeft').textContent = `距年末还有 ${Math.max(0, 365 - doy)} 天`;
    document.getElementById('yearPct').textContent = yearPct.toFixed(1) + '%';
    document.getElementById('yearFill').style.width = yearPct.toFixed(1) + '%';

    const ageDecimal = (now - BIRTH) / YEAR_MS;
    const livedDays = Math.floor((now - BIRTH) / 86400000);
    const lifePct = Math.min(100, (ageDecimal / LIFE_EXPECTANCY) * 100);

    document.getElementById('ageValue').textContent = `${ageDecimal.toFixed(1)} 周岁`;
    document.getElementById('daysLived').textContent = `已体验 ${livedDays.toLocaleString('zh-CN')} 天`;
    document.getElementById('lifePct').textContent = lifePct.toFixed(1) + '%';
    document.getElementById('lifeFill').style.width = lifePct.toFixed(1) + '%';
  }

  tick();
  setInterval(tick, 1000);
</script>

</body>
</html>
