<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>人生进度</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&family=Noto+Sans+SC:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --page:#1A1A19;
    --card-bg:#F0EEE6;
    --text:#000000;
    --time-accent:#D97757;
    --line: rgba(0,0,0,0.12);
    --bar-track:#232321;
    --bar-fill:#D97757;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(circle at 20% 10%, rgba(197,140,60,0.10), transparent 45%),
      radial-gradient(circle at 85% 90%, rgba(124,138,110,0.10), transparent 40%),
      var(--page);
    font-family:'Space Mono', monospace;
    color:var(--text);
    padding:32px 20px;
  }
  .stage{ width:100%; max-width:360px; }
  .card{
    position:relative;
    width:100%;
    background:var(--card-bg);
    border:1px solid var(--line);
    border-radius:6px;
    padding:30px 26px 24px;
    box-shadow: 0 24px 48px -20px rgba(0,0,0,0.35), 0 0 0 1px rgba(0,0,0,0.04);
    opacity:0;
    transform:translateY(14px) scale(0.98);
    animation:rise 0.7s cubic-bezier(.2,.8,.2,1) forwards;
  }
  @keyframes rise{ to{ opacity:1; transform:translateY(0) scale(1);} }

  .brand{
    display:flex; align-items:center; justify-content:center; gap:8px;
    font-family:'Space Mono', monospace; font-weight:700; font-size:16px;
    letter-spacing:0.1em; color:var(--text); text-transform:uppercase;
    text-align:center;
  }
  .brand svg{ width:13px; height:13px; opacity:0.85; flex-shrink:0; }

  .top-layout{ display:block; }
  .top-info{ min-width:0; }
  .time-row{ display:flex; align-items:center; justify-content:flex-start; margin-top:5px; }
  .weather-temp{ font-family:'Space Mono', monospace; font-size:14px; font-weight:700; white-space:nowrap; }
  .date-line .weather-temp{ font-family:'Space Mono', monospace; font-size:14px; font-weight:400; }
  .weather-city{ opacity:1; }

  .clock{
    font-family:'Space Mono', monospace;
    font-weight:700;
    font-size:60px;
    letter-spacing:0.05em;
    text-align:left;
    width:auto;
    margin-left:0;
    margin-right:0;
    margin-top:0;
    color:var(--time-accent);
    font-variant-numeric: tabular-nums;
  }
  .clock span.sec{ font-size:60px; color:var(--time-accent); }
  .date-line{
    display:flex;
    align-items:center;
    gap:8px;
    text-align:left;
    font-size:14px;
    white-space:nowrap;
    color:var(--text);
    letter-spacing:0.1em;
    margin-top:5px;
    opacity:0.75;
  }

  .rule{ height:1px; background:var(--line); margin:22px 0; }

  .row{ display:grid; grid-template-columns:minmax(0,1fr) auto; grid-template-rows:auto auto auto; column-gap:18px; row-gap:4px; align-items:end; }

  .stat-block{ display:contents; }
  .stat-label{ grid-column:1; grid-row:1; align-self:start; font-size:11px; color:var(--text); letter-spacing:0.1em; text-transform:uppercase; margin-bottom:0; opacity:0.55; }
  .stat-value{ grid-column:1; grid-row:2; font-family:'Space Mono', monospace; font-weight:900; font-size:18px; color:var(--text); line-height:1.4; letter-spacing:0.1em; }
  .stat-sub{ grid-column:1; grid-row:3; font-size:11px; color:var(--text); margin-top:2px; opacity:0.65; letter-spacing:0.1em; }

  .progress-side{ display:contents; }
  .progress-pct{ grid-column:2; grid-row:2; justify-self:end; font-family:'Space Mono', monospace; font-weight:700; font-size:20px; color:var(--text); }
  .progress-note{ grid-column:2; grid-row:1; align-self:start; justify-self:end; font-size:9px; color:var(--text); opacity:0.5; letter-spacing:0.1em; }
  .progress-track{
    grid-column:2; grid-row:3; justify-self:end; width:96px; height:8px; border-radius:999px; background:var(--bar-track); overflow:hidden; transform:translateY(-4px);
  }
  .progress-fill{
    height:100%; background:var(--bar-fill); border-radius:999px;
    transition: width 0.6s cubic-bezier(.2,.8,.2,1);
  }

  .meta{
    display:flex; justify-content:space-between; font-size:10px;
    color:var(--text); letter-spacing:0.1em; padding-top:20px; opacity:0.6;
  }
  .meta span:first-child{ letter-spacing:0.1em; }

  @media (prefers-reduced-motion: reduce){ .card{ animation:none; opacity:1; transform:none; } }
</style>
</head>
<body>

<div class="stage">
  <div class="card" id="card">
    <div class="top-layout">
      <div class="top-info">
        <div class="brand" id="brandLine">马老师，-- ！</div>
        <div class="time-row">
          <div class="clock" id="clock">--:--<span class="sec">:--</span></div>
        </div>
        <div class="date-line" id="dateLine">
          <span id="dateValue">-- -- --</span><span>·</span><span id="weekdayValue">--</span><span>·</span><span class="weather-city">上海</span><span>·</span><span class="weather-temp" id="weatherTemp">--°C</span>
        </div>
      </div>
    </div>

    <div class="rule"></div>

    <div class="row">
      <div class="stat-block">
        <div class="stat-label">今年进度</div>
        <div class="stat-value" id="dayOfYear">--天</div>
        <div class="stat-sub" id="daysLeft">距年末还有--天</div>
      </div>
      <div class="progress-side">
        <div class="progress-pct" id="yearPct">0%</div>
        <div class="progress-track"><div class="progress-fill" id="yearFill" style="width:0%"></div></div>
      </div>
    </div>

    <div class="rule"></div>

    <div class="row">
      <div class="stat-block">
        <div class="stat-label">今日年龄</div>
        <div class="stat-value" id="ageValue">--周岁</div>
        <div class="stat-sub" id="daysLived">已体验--天</div>
      </div>
      <div class="progress-side">
        <div class="progress-note">按80岁计</div>
        <div class="progress-pct" id="lifePct">0%</div>
        <div class="progress-track"><div class="progress-fill" id="lifeFill" style="width:0%"></div></div>
      </div>
    </div>

    <div class="rule"></div>

    <div class="meta">
      <span>人生体验家</span>
      <span>No.1</span>
    </div>
  </div>
</div>

<script>
  // 已通过权威万年历核对：农历1992年十一月初一 = 公历1992年11月24日（壬申年 辛亥月 甲辰日）
  const BIRTH = new Date(1992, 10, 24, 0, 0, 0);
  const LIFE_EXPECTANCY = 80;
  const YEAR_MS = 365.2425 * 86400000;

  function pad(n){ return String(n).padStart(2,'0'); }

  function dayOfYear(d){
    const start = new Date(d.getFullYear(), 0, 0);
    return Math.floor((d - start) / 86400000);
  }

  function greeting(hour){
    if(hour >= 5 && hour < 11) return '早上好';
    if(hour >= 11 && hour < 18) return '中午好';
    return '晚上好';
  }

  const weekMap = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];

  const weatherIcons = {
    0:'☀️', 1:'🌤️', 2:'⛅', 3:'☁️',
    45:'🌫️', 48:'🌫️', 51:'🌦️', 53:'🌦️', 55:'🌧️',
    61:'🌧️', 63:'🌧️', 65:'🌧️', 71:'🌨️', 73:'🌨️', 75:'❄️',
    80:'🌦️', 81:'🌧️', 82:'⛈️', 95:'⛈️', 96:'⛈️', 99:'⛈️'
  };

  async function updateWeather(){
    try{
      const response = await fetch('https://api.open-meteo.com/v1/forecast?latitude=31.2304&longitude=121.4737&current=temperature_2m,weather_code&timezone=Asia%2FShanghai');
      if(!response.ok) throw new Error('weather request failed');
      const data = await response.json();
      document.getElementById('weatherTemp').textContent = `${Math.round(data.current.temperature_2m)}°C`;
    }catch(error){
      document.getElementById('weatherTemp').textContent = '--°C';
    }
  }

  function tick(){
    const now = new Date();

    document.getElementById('brandLine').textContent = `马老师，${greeting(now.getHours())}！`;

    document.getElementById('clock').innerHTML =
      `${pad(now.getHours())}:${pad(now.getMinutes())}<span class="sec">:${pad(now.getSeconds())}</span>`;
    document.getElementById('dateValue').textContent =
      `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日`;
    document.getElementById('weekdayValue').textContent = weekMap[now.getDay()];

    const doy = dayOfYear(now);
    const yearPct = Math.min(100, (doy / 365) * 100);
    document.getElementById('dayOfYear').textContent = `${doy}天`;
    document.getElementById('daysLeft').textContent = `距年末还有${Math.max(0, 365 - doy)}天`;
    document.getElementById('yearPct').textContent = yearPct.toFixed(1) + '%';
    document.getElementById('yearFill').style.width = yearPct.toFixed(1) + '%';

    const ageDecimal = (now - BIRTH) / YEAR_MS;
    const livedDays = Math.floor((now - BIRTH) / 86400000);
    const lifePct = Math.min(100, (ageDecimal / LIFE_EXPECTANCY) * 100);

    document.getElementById('ageValue').textContent = `${ageDecimal.toFixed(1)}周岁`;
    document.getElementById('daysLived').textContent = `已体验${livedDays.toLocaleString('zh-CN')}天`;
    document.getElementById('lifePct').textContent = lifePct.toFixed(1) + '%';
    document.getElementById('lifeFill').style.width = lifePct.toFixed(1) + '%';
  }

  tick();
  setInterval(tick, 1000);
  updateWeather();
  setInterval(updateWeather, 600000);
</script>

</body>
</html>
